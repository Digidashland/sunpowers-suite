<style>
/* ---- splash: app icon only + running-lines loader ---- */
#splash{position:fixed;inset:0;z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(120% 90% at 50% 0%,#2f9e4f 0%,#14622e 55%,#0b3a1b 100%);pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(46vw,190px);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.38));animation:spPop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash .sp-run{display:flex;flex-direction:column;gap:6px;width:150px}
#splash .sp-run i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
#splash .sp-run i:before{content:"";position:absolute;top:0;bottom:0;left:-45%;width:45%;border-radius:3px;background:linear-gradient(90deg,transparent,#f9a825,#fff6d6);animation:spRun 1.1s linear infinite}
#splash .sp-run i:nth-child(2){width:78%;margin-left:11%}#splash .sp-run i:nth-child(2):before{animation-duration:1.4s;animation-delay:.15s}
#splash .sp-run i:nth-child(3){width:56%;margin-left:22%}#splash .sp-run i:nth-child(3):before{animation-duration:.9s;animation-delay:.3s}
@keyframes spPop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes spRun{from{left:-45%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash .sp-run i:before{animation:none;left:0;width:100%}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true" data-noi18n><img src="splash-icon.png" alt="" width="190" height="190"><div class="sp-run"><i></i><i></i><i></i></div></div>
<script>(function(){var d=document.getElementById('splash');if(!d)return;document.documentElement.appendChild(d);var seen=false;try{seen=sessionStorage.getItem('sp_splash_crm')==='1';sessionStorage.setItem('sp_splash_crm','1');}catch(e){}
if(seen){d.remove();return;}
function hide(){d.classList.add('out');setTimeout(function(){if(d.parentNode)d.remove();},600);}
var t0=Date.now();function ready(){setTimeout(hide,Math.max(0,1500-(Date.now()-t0)));}
if(document.readyState==='complete')ready();else window.addEventListener('load',ready);setTimeout(hide,3800);})();</script>
