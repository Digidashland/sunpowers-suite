<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Sunpowers</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--g:#1e8e3e;--g-d:#14692c;--g-l:#e8f5e9;--bg:#f3f6f2;--txt:#1c2b20;--mut:#66756a;--line:#dfe7de;--red:#d93025;--org:#e8590c;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--g-d)}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.top h1{font-size:18px;font-weight:800;color:var(--g-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.tcnt{margin-left:6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.tab.on .tcnt{background:#fff;color:var(--red)}
.chk2{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}.chk2 input{width:18px;height:18px;margin-top:2px;flex:none}
main{max-width:1100px;margin:0 auto;padding:14px 12px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--g);color:#fff;white-space:nowrap}
.btn.out{background:#fff;color:var(--g-d);border:1.5px solid var(--g)}
.btn.gray{background:#eef2ed;color:var(--txt)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #f2b8b3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;font-size:15px;flex:none}
.ib:disabled{opacity:.35}
.ib.red{color:var(--red)}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.card h2{font-size:17px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:160px}
.inp{width:100%;border:1px solid #cdd7cc;border-radius:10px;padding:9px 11px;background:#fff;outline:0}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g-l)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row.dim{opacity:.55}
.th{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:26px;overflow:hidden;position:relative;background:var(--g-l)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rm{flex:1;min-width:0}
.rm b{display:block;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.rm small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.row{flex-wrap:wrap}.row .rm{flex:1 1 calc(100% - 66px)}.row .acts{width:100%;padding-top:6px;border-top:1px dashed var(--line)}.row small{white-space:normal}}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--g-l);color:var(--g-d);margin-right:4px}
.tag.o{background:#fff1e0;color:#b45309}.tag.r{background:#fdecea;color:var(--red)}.tag.b{background:#e3f2fd;color:#0d47a1}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.note.g{background:var(--g-l);border-color:#bfe3c4}
.note.r{background:#fdecea;border-color:#f5c2bd}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* forms */
.fg{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}}
.fld label.l{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=password],.fld select,.fld textarea{width:100%;border:1px solid #cdd7cc;border-radius:10px;padding:9px 11px;background:#fff;outline:0}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g-l)}
.fld input[type=color]{width:56px;height:38px;border:1px solid #cdd7cc;border-radius:10px;padding:2px;background:#fff}
.fld .help{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.fld .err{display:block;color:var(--red);font-size:12px;margin-top:3px}
.fld.bad input,.fld.bad select,.fld.bad textarea,.fld.bad .secs{border-color:var(--red)!important}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.imgf{display:grid;gap:8px}
.imgprev{width:100%;max-width:260px;aspect-ratio:16/10;border-radius:12px;border:1px dashed #b7c4b6;display:grid;place-items:center;color:var(--mut);font-size:13px;overflow:hidden;position:relative;background:#fafcf9}
.imgprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.imgbtns{display:flex;gap:6px;flex-wrap:wrap}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mimgs{display:flex;gap:8px;flex-wrap:wrap}
.mimg{width:74px;height:74px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);background:#fafcf9}
.mimg img{width:100%;height:100%;object-fit:cover}
.mimg button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px}
.secs{display:grid;gap:4px;border:1px solid #cdd7cc;border-radius:10px;padding:8px;max-height:260px;overflow:auto;background:#fff}
.secs label{display:flex;gap:8px;align-items:center;padding:4px;border-radius:8px;cursor:pointer}
.secs label:hover{background:var(--g-l)}
.secs input{width:18px;height:18px;accent-color:var(--g)}
.lnk{display:grid;grid-template-columns:150px 1fr;gap:6px}
@media(max-width:480px){.lnk{grid-template-columns:1fr}}
/* modal */
.mb{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mb{align-items:center;padding:20px}}
.md{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){.md{border-radius:20px}}
.md-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.md-h b{flex:1;font-size:17px}
.md-b{padding:16px;overflow:auto;flex:1}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:#fafcf9;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.md-f .btn{flex:1}
@media(min-width:700px){.md-f .btn{flex:none;min-width:120px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2b20;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fdecea;border-top:1px solid #f5c2bd;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:22px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2ed}
.status.new{background:#fff1e0;color:#b45309}.status.confirmed,.status.contacted{background:#e3f2fd;color:#0d47a1}
.status.paid,.status.shipped{background:#ede7f6;color:#4527a0}.status.delivered,.status.closed{background:var(--g-l);color:var(--g-d)}.status.cancelled{background:#fdecea;color:var(--red)}
.kv{font-size:14px;display:grid;gap:3px;margin:6px 0}
.kv span{color:var(--mut)}
.sl-list .row{padding:8px}
.pos{border:2px solid var(--g);background:var(--g-l);border-radius:12px;padding:10px;margin-bottom:12px}
.pos label{font-weight:800;display:block;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat b{display:block;font-size:22px;color:var(--g-d)}
.stat small{color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
table.imp{width:100%;border-collapse:collapse;font-size:14px}
table.imp td,table.imp th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="lic.js?v=1" data-app="admin"></script>
<script src="core.js"></script>
<script src="xlsx-lite.js"></script>
<script src="auth.js"></script>
<script>
(function () {
'use strict';
var esc = SP.esc;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var app = $('#app');
var PASS = SP.ss.get('sp_admin_pass') || SP.ls.get('sp_admin_pass_keep', null) || '';
function isTok(x) { return /^[0-9a-f]{48}$/.test(x || ''); }
var D = null, IS_DEMO = false, TAB = SP.ss.get('sp_admin_tab') || 'layout', UP = 0, saveChain = Promise.resolve(), dirty = false;
var PROD_FILTER = { q: '', sec: '' };
var CFG = window.SP_CONFIG || {};
function storeBase() { return String(CFG.STORE_URL || (D && D.settings && D.settings.siteUrl) || '').replace(/\/+$/, ''); }
function storeLink() { return storeBase() || '../'; }

function toast(m, err) { var el = $('#toast'); el.textContent = m; el.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(function () { el.className = 'toast'; }, err ? 4200 : 2400); }
function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o); }
function setPath(o, p, v) { var ks = p.split('.'), a = o; for (var i = 0; i < ks.length - 1; i++) { if (!isObj(a[ks[i]])) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }
function sec(id) { return D.sections.filter(function (s) { return s.id === id; })[0]; }
function prod(id) { return D.products.filter(function (p) { return p.id === id; })[0]; }
function ssById(id) { return D.slideshows.filter(function (s) { return s.id === id; })[0]; }
function thumb(src, emoji, bg) { return '<div class="th" style="background:' + esc(bg || '#e8f5e9') + '">' + esc(emoji || '🖼️') + (SP.isImg(src) ? '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>'; }
function download(blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(s) { try { return new Date(s).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return s; } }

/* ======================= modal / confirm ======================= */
function modal(title, body, actions, onOpen) {
  var bg = document.createElement('div'); bg.className = 'mb';
  bg.innerHTML = '<div class="md" role="dialog" aria-modal="true"><div class="md-h"><b>' + esc(title) + '</b><button class="ib" data-x aria-label="Close">✕</button></div><div class="md-b"></div><div class="md-f"></div></div>';
  var b = $('.md-b', bg); if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
  var f = $('.md-f', bg), m = { el: bg, body: b, close: function () { bg.remove(); if (!$('.mb')) document.body.style.overflow = ''; } };
  (actions || [{ l: 'बंद करें', cls: 'gray' }]).forEach(function (a) {
    var btn = document.createElement('button'); btn.className = 'btn ' + (a.cls || ''); btn.innerHTML = a.l; if (a.id) btn.id = a.id;
    btn.addEventListener('click', async function () {
      if (!a.fn) return m.close();
      if (btn.disabled) return;
      btn.disabled = true; var old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>';
      try { var r = await a.fn(m); if (r !== false) m.close(); } catch (e) { console.error(e); toast(e.message || String(e), true); }
      btn.disabled = false; btn.innerHTML = old;
    });
    f.appendChild(btn);
  });
  $('[data-x]', bg).addEventListener('click', m.close);
  document.body.appendChild(bg); document.body.style.overflow = 'hidden';
  if (onOpen) onOpen(m);
  return m;
}
function ask(msg, okLabel, danger) {
  return new Promise(function (res) {
    var done = false;
    var m = modal('पुष्टि करें', '<p style="font-size:16px">' + msg + '</p>', [
      { l: 'रद्द करें', cls: 'gray', fn: function () { done = true; res(false); } },
      { l: okLabel || 'हाँ', cls: danger ? 'red' : '', fn: function () { done = true; res(true); } }]);
    $('[data-x]', m.el).addEventListener('click', function () { if (!done) res(false); });
  });
}

/* ======================= form builder ======================= */
var LINK_TYPES = [['none', '— कोई लिंक नहीं —'], ['section', 'Section / Category खोलें'], ['product', 'Product खोलें'], ['form', 'Requirement Form खोलें'], ['whatsapp', 'WhatsApp पर मैसेज'], ['call', 'कॉल करें'], ['url', 'कोई भी वेबसाइट URL']];
var fid = 0;
function F(fields, obj) { return '<div class="fg">' + fields.map(function (f) { return fieldHtml(f, obj || {}); }).join('') + '</div>'; }
function fieldHtml(f, obj) {
  var id = 'f' + (++fid), v = f.t === 'link' ? null : getPath(obj, f.k), lab = '<label class="l" for="' + id + '">' + esc(f.l) + (f.req ? ' <span style="color:var(--red)">*</span>' : '') + '</label>';
  var help = f.h ? '<small class="help">' + f.h + '</small>' : '', inner = '';
  if (v === undefined || v === null) v = f.d !== undefined ? f.d : '';
  switch (f.t) {
    case 'textarea': inner = lab + '<textarea id="' + id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>'; break;
    case 'lines': inner = lab + '<textarea id="' + id + '" rows="' + (f.rows || 5) + '" placeholder="' + esc(f.ph || '') + '">' + esc((Array.isArray(v) ? v : []).join('\n')) + '</textarea>'; break;
    case 'number': inner = lab + '<input type="number" step="any" inputmode="decimal" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">'; break;
    case 'color': inner = lab + '<input type="color" id="' + id + '" value="' + (/^#[0-9a-f]{6}$/i.test(v) ? v : (f.d || '#e8f5e9')) + '">'; break;
    case 'select': inner = lab + '<select id="' + id + '">' + f.o.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; break;
    case 'check': inner = '<label class="chk"><input type="checkbox" id="' + id + '"' + (v === true || v === 'yes' ? ' checked' : '') + '> ' + esc(f.l) + '</label>'; break;
    case 'image': inner = lab + '<div class="imgf"><div class="imgprev">' + (SP.isImg(v) ? '<img src="' + esc(v) + '" alt="">' : 'कोई फ़ोटो नहीं') + '</div>' +
      '<div class="imgbtns"><span class="btn sm upl">📷 फ़ोटो अपलोड<input type="file" accept="image/*"></span><button type="button" class="btn sm gray" data-clr>हटाएँ</button></div>' +
      '<input type="text" id="' + id + '" class="imgurl" placeholder="या image का URL paste करें" value="' + esc(/^data:/.test(v) ? '' : v) + '" data-full="' + esc(v) + '"></div>'; break;
    case 'images': inner = lab + '<div class="imgf"><div class="mimgs"></div><div class="imgbtns"><span class="btn sm upl">📷 फ़ोटो जोड़ें<input type="file" accept="image/*" multiple></span></div>' +
      '<div style="display:flex;gap:6px"><input type="text" class="inp" placeholder="या image URL paste करें"><button type="button" class="btn sm out" data-addurl>जोड़ें</button></div></div>'; break;
    case 'multisec': inner = lab + '<div class="secs">' + D.sections.map(function (s) {
        return '<label><input type="checkbox" value="' + esc(s.id) + '"' + ((v || []).indexOf(s.id) >= 0 ? ' checked' : '') + '> ' + esc(s.icon || '') + ' ' + esc(s.title) + ' <span class="tag' + (s.kind === 'update' ? ' o' : '') + '">' + (s.kind === 'update' ? 'Update' : 'Category') + '</span></label>';
      }).join('') + (D.sections.length ? '' : '<span style="color:var(--mut)">पहले Section बनाएँ</span>') + '</div>'; break;
    case 'link': inner = lab + '<div class="lnk"><select id="' + id + '" data-lt>' + LINK_TYPES.map(function (o) { return '<option value="' + o[0] + '"' + ((obj.linkType || 'none') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select><div data-ltgt></div></div>'; break;
    default: inner = lab + '<input type="' + (f.t === 'password' ? 'password' : 'text') + '" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"' + (f.max ? ' maxlength="' + f.max + '"' : '') + '>';
  }
  return '<div class="fld' + (f.full || ['textarea', 'lines', 'images', 'multisec', 'link'].indexOf(f.t) >= 0 ? ' full' : '') + '" data-k="' + esc(f.k) + '" data-t="' + f.t + '"' +
    (f.t === 'images' ? ' data-v="' + esc(JSON.stringify(Array.isArray(v) ? v : [])) + '"' : '') + (f.t === 'link' ? ' data-l="' + esc(obj.link || '') + '"' : '') + '>' + inner + help + '<span class="err hide"></span></div>';
}
function linkTarget(fld, type, val) {
  var box = $('[data-ltgt]', fld), h = '';
  if (type === 'section') h = '<select class="inp">' + D.sections.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === val ? ' selected' : '') + '>' + esc(s.title) + '</option>'; }).join('') + '</select>';
  else if (type === 'product') h = '<select class="inp">' + SP.sortProducts(D.products).map(function (p) { return '<option value="' + esc(p.id) + '"' + (p.id === val ? ' selected' : '') + '>' + esc(p.title) + '</option>'; }).join('') + '</select>';
  else if (type === 'url') h = '<input class="inp" type="text" placeholder="https://..." value="' + esc(val) + '">';
  else if (type === 'whatsapp') h = '<input class="inp" type="text" placeholder="पहले से लिखा मैसेज (वैकल्पिक)" value="' + esc(val) + '">';
  else if (type === 'call') h = '<input class="inp" type="text" placeholder="फ़ोन नंबर (ख़ाली = स्टोर नंबर)" value="' + esc(val) + '">';
  else if (type === 'form') h = '<div style="color:var(--mut);font-size:13px;padding-top:8px">ग्राहक का क्लिक → होम पेज का Requirement Form खुलेगा (टाइटल अपने आप भर जाएगा)</div>';
  box.innerHTML = h;
}
function renderMimgs(fld) {
  var list = fld._list || [];
  $('.mimgs', fld).innerHTML = list.map(function (u, i) { return '<div class="mimg"><img src="' + esc(u) + '" alt="" onerror="this.style.opacity=.2"><button type="button" data-rmi="' + i + '">✕</button></div>'; }).join('') || '<span style="color:var(--mut);font-size:13px">कोई अतिरिक्त फ़ोटो नहीं</span>';
}
async function handleUpload(file) {
  UP++;
  try {

async function deleteSection(id) {
  var s = sec(id); if (!s) return;
  var n = SP.productsOf(D, id, true).length;
  if (!(await ask('सेक्शन "<b>' + esc(s.title) + '</b>" डिलीट करें?<br><small>इसके ' + n + ' प्रोडक्ट डिलीट नहीं होंगे, बस इस सेक्शन से हट जाएँगे।</small>', 'डिलीट', true))) return;
  D.sections = D.sections.filter(function (x) { return x.id !== id; });
  D.products.forEach(function (p) { p.sections = p.sections.filter(function (x) { return x !== id; }); });
  D.layout = D.layout.filter(function (b) { return !(b.type === 'section' && b.ref === id); });
  render(); save('🗑 सेक्शन डिलीट हो गया');
}

function validPrice(v) {

  return true;
}
