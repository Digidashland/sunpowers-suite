<style>
:root{--g:#1e8e3e;--g-d:#14692c;--g-l:#e8f5e9;--bg:#f3f6f2;--txt:#1c2b20;--mut:#66756a;--line:#dfe7de;--red:#d93025;--org:#e8590c;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--g-d)}
.hide{display:none!important}
/* Round 25: which page am I editing? green = Store App, golden = Web Shop (website); two-colour = applies to both */
.via{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:12px;padding:9px 12px;margin:0 0 10px;font-weight:700;font-size:14px;border:1px solid;animation:viaF 1.5s ease-out 2;--fl:30,142,62}
.via i{width:10px;height:10px;border-radius:50%;flex:none;animation:viaP 1.6s ease-in-out infinite}
.via small{font-weight:500;opacity:.85}
.via.st{background:linear-gradient(90deg,#e1f3e4,#f3faf4);border-color:#b2dcba;color:#14692c}.via.st i{background:#1e8e3e}
.via.sh{background:linear-gradient(90deg,#fdeccb,#fff7e6);border-color:#f0cd86;color:#7a4e00;--fl:245,166,35}.via.sh i{background:#f5a623}
.via.bo{background:linear-gradient(90deg,#e1f3e4 0,#f1f7e6 48%,#fdeccb 100%);border-color:#c9d79a;color:#46510f}.via.bo i{background:linear-gradient(90deg,#1e8e3e 50%,#f5a623 50%)}
.via.bo2{background:linear-gradient(90deg,#fdeccb 0,#f1f7e6 52%,#e1f3e4 100%);border-color:#c9d79a;color:#46510f;--fl:245,166,35}.via.bo2 i{background:linear-gradient(90deg,#f5a623 50%,#1e8e3e 50%)}
@keyframes viaF{0%{box-shadow:0 0 0 0 rgba(var(--fl),.6)}100%{box-shadow:0 0 0 16px rgba(var(--fl),0)}}
@keyframes viaP{50%{transform:scale(.55);opacity:.5}}
.pch{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 6px;border-radius:9px;font-size:15px;border:1px solid var(--line);background:#fff;opacity:.45;filter:grayscale(1)}
.pch.on{opacity:1;filter:none}.pch.st.on{background:#e1f3e4;border-color:#9fd2a8}.pch.sh.on{background:#fdeccb;border-color:#efc774}.pch[disabled]{cursor:not-allowed}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}.top-in h1{min-width:0}
.top h1{font-size:18px;font-weight:800;color:var(--g-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-ed{padding:10px;border:1px dashed #b9cdb9;border-radius:10px;margin:6px 0 12px;background:#fbfdfb}.wb-it.open>.row{background:#eef7ee}.wb-it{margin-bottom:6px}
.chk2{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}.chk2 input{width:18px;height:18px;margin-top:2px;flex:none}
main{max-width:1100px;margin:0 auto;padding:14px 12px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--g);color:#fff;white-space:nowrap}
.btn.out{background:#fff;color:var(--g-d);border:1.5px solid var(--g)}
.btn.gray{background:#eef2ed;color:var(--txt)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #f2b8b3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;font-size:15px;flex:none}
.ib:disabled{opacity:.35}
.ib.red{color:var(--red)}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.card h2{font-size:17px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:160px}
.inp{width:100%;border:1px solid #cdd7cc;border-radius:10px;padding:9px 11px;background:#fff;outline:0}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g-l)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row.dim{opacity:.55}
.th{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:26px;overflow:hidden;position:relative;background:var(--g-l)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rm{flex:1;min-width:0}
.rm b{display:block;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.rm small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.row{flex-wrap:wrap}.row .rm{flex:1 1 calc(100% - 66px)}.row .acts{width:100%;padding-top:6px;border-top:1px dashed var(--line)}.row small{white-space:normal}}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--g-l);color:var(--g-d);margin-right:4px}
.tag.o{background:#fff1e0;color:#b45309}.tag.r{background:#fdecea;color:var(--red)}.tag.b{background:#e3f2fd;color:#0d47a1}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.note.g{background:var(--g-l);border-color:#bfe3c4}
.note.r{background:#fdecea;border-color:#f5c2bd}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* forms */
.more{margin-top:12px;border:1px dashed #b7c8b5;border-radius:10px;padding:8px 12px;background:#fafdf9}.more>summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--g-d);margin-bottom:8px}
.fg{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}}
.fld label.l{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=password],.fld select,.fld textarea{width:100%;border:1px solid #cdd7cc;border-radius:10px;padding:9px 11px;background:#fff;outline:0}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g-l)}
.fld input[type=color]{width:56px;height:38px;border:1px solid #cdd7cc;border-radius:10px;padding:2px;background:#fff}
.fld .help{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.fld .err{display:block;color:var(--red);font-size:12px;margin-top:3px}
.fld.bad input,.fld.bad select,.fld.bad textarea,.fld.bad .secs{border-color:var(--red)!important}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.imgf{display:grid;gap:8px}
.imgprev{width:100%;max-width:260px;aspect-ratio:16/10;border-radius:12px;border:1px dashed #b7c4b6;display:grid;place-items:center;color:var(--mut);font-size:13px;overflow:hidden;position:relative;background:#fafcf9}
.imgprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.imgbtns{display:flex;gap:6px;flex-wrap:wrap}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mimgs{display:flex;gap:8px;flex-wrap:wrap}
.mmed{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.mmi{width:92px;border-radius:10px;overflow:hidden;position:relative;border:2px solid var(--line);background:#fafcf9}
.mmi.main{border-color:var(--g,#2e7d32);box-shadow:0 0 0 2px rgba(46,125,50,.25)}
.mmi img,.mmi video{width:100%;height:92px;object-fit:cover;display:block;background:#111}
.mmi .mk{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:0 4px;font-size:12px}
.imgf [hidden]{display:none!important}.mmi button.rp,.mimg button.rp{right:auto!important;left:2px;top:auto!important;bottom:2px}.mmi button.rl,.mimg button.rl{right:auto!important;left:26px;top:auto!important;bottom:2px}.mmi button.rp,.mmi button.rl{bottom:24px}.mmi button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px}
.mmain{display:flex;gap:4px;align-items:center;justify-content:center;font-size:12px;padding:3px;cursor:pointer}
.mcnt{width:100%;font-size:12px;color:var(--mut)}
.mimg{width:74px;height:74px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);background:#fafcf9}
.mimg img{width:100%;height:100%;object-fit:cover}
.mimg button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px}
.secs{display:grid;gap:4px;border:1px solid #cdd7cc;border-radius:10px;padding:8px;max-height:260px;overflow:auto;background:#fff}
.secs label{display:flex;gap:8px;align-items:center;padding:4px;border-radius:8px;cursor:pointer}
.secs label:hover{background:var(--g-l)}
.secs input{width:18px;height:18px;accent-color:var(--g)}
.lnk{display:grid;grid-template-columns:150px 1fr;gap:6px}
@media(max-width:480px){.lnk{grid-template-columns:1fr}}
/* modal */
.mb{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mb{align-items:center;padding:20px}}
.md{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){.md{border-radius:20px}}
.md-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.md-h b{flex:1;font-size:17px}
.md-b{padding:16px;overflow:auto;flex:1}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:#fafcf9;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.md-f .btn{flex:1}
@media(min-width:700px){.md-f .btn{flex:none;min-width:120px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2b20;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fdecea;border-top:1px solid #f5c2bd;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:22px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2ed}
.status.new{background:#fff1e0;color:#b45309}.status.confirmed,.status.contacted{background:#e3f2fd;color:#0d47a1}
.status.paid,.status.shipped{background:#ede7f6;color:#4527a0}.status.delivered,.status.closed{background:var(--g-l);color:var(--g-d)}.status.cancelled{background:#fdecea;color:var(--red)}
.kv{font-size:14px;display:grid;gap:3px;margin:6px 0}
.kv span{color:var(--mut)}
.sl-list .row{padding:8px}
.pos{border:2px solid var(--g);background:var(--g-l);border-radius:12px;padding:10px;margin-bottom:12px}
.pos label{font-weight:800;display:block;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat b{display:block;font-size:22px;color:var(--g-d)}
.stat small{color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
table.imp{width:100%;border-collapse:collapse;font-size:14px}
table.imp td,table.imp th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
</style>
<style>
/* ---- splash: app icon only + running-lines loader ---- */
#splash{position:fixed;inset:0;z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(120% 90% at 50% 0%,#2f9e4f 0%,#14622e 55%,#0b3a1b 100%);pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(46vw,190px);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.38));animation:spPop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash .sp-run{display:flex;flex-direction:column;gap:6px;width:150px}
#splash .sp-run i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
#splash .sp-run i:before{content:"";position:absolute;top:0;bottom:0;left:-45%;width:45%;border-radius:3px;background:linear-gradient(90deg,transparent,#f9a825,#fff6d6);animation:spRun 1.1s linear infinite}
#splash .sp-run i:nth-child(2){width:78%;margin-left:11%}#splash .sp-run i:nth-child(2):before{animation-duration:1.4s;animation-delay:.15s}
#splash .sp-run i:nth-child(3){width:56%;margin-left:22%}#splash .sp-run i:nth-child(3):before{animation-duration:.9s;animation-delay:.3s}
@keyframes spPop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes spRun{from{left:-45%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash .sp-run i:before{animation:none;left:0;width:100%}}
</style>
</head>

<script>(function(){var d=document.getElementById('splash');if(!d)return;document.documentElement.appendChild(d);var seen=false;try{seen=sessionStorage.getItem('sp_splash_admin')==='1';sessionStorage.setItem('sp_splash_admin','1');}catch(e){}
if(seen){d.remove();return;}
function hide(){d.classList.add('out');setTimeout(function(){if(d.parentNode)d.remove();},600);}
var t0=Date.now();function ready(){setTimeout(hide,Math.max(0,1500-(Date.now()-t0)));}
if(document.readyState==='complete')ready();else window.addEventListener('load',ready);setTimeout(hide,3800);})();</script>
