"20" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="400.0" y="280" font-size="15" font-weight="800" fill="#0f4d2b" text-anchor="middle" >Inspection</text><text x="400.0" y="304" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >sthal ki</text><text x="400.0" y="321" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >jaanch</text><circle cx="560.0" cy="220" r="24" fill="#1e8e3e" stroke="#fff" stroke-width="4"/><text x="560.0" y="227" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="560.0" y="280" font-size="15" font-weight="800" fill="#0f4d2b" text-anchor="middle" >Meter</text><text x="560.0" y="304" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >net meter</text><text x="560.0" y="321" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >lagna</text><circle cx="720.0" cy="220" r="24" fill="#1e8e3e" stroke="#fff" stroke-width="4"/><text x="720.0" y="227" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="720.0" y="280" font-size="15" font-weight="800" fill="#0f4d2b" text-anchor="middle" >Chalu</text><text x="720.0" y="304" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >bijli ka</text><text x="720.0" y="321" font-size="12.5" font-weight="500" fill="#5d6f62" text-anchor="middle" >hisaab shuru</text><rect x="60" y="372" width="680" height="60" rx="14" fill="#fff" stroke="#cfe0d2" stroke-width="1.5" /><text x="400" y="400" font-size="14" font-weight="800" fill="#0f4d2b" text-anchor="middle" >Samay aapke ilaake ki bijli company aur sthiti par nirbhar karta hai.</text><text x="400" y="421" font-size="13" font-weight="500" fill="#5d6f62" text-anchor="middle" >Hum har kadam par follow-up karte hain — aap bas jaankari dete rahein.</text><g opacity="0.07" transform="rotate(-18 400 290)"><text x="400" y="300" font-size="84" font-weight="900" fill="#0f4d2b" text-anchor="middle" >SA