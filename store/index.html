<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunpowers — सोलर पैनल, इन्वर्टर, बैटरी ऑनलाइन</title>
<meta name="description" content="Sunpowers — सोलर पैनल, इन्वर्टर, बैटरी, सोलर पंप, वाटर हीटर और कम्प्लीट सोलर सिस्टम ऑनलाइन ऑर्डर करें। Cash on Delivery और UPI उपलब्ध।">
<meta name="theme-color" content="#1e8e3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Sunpowers — Solar Products Online">
<meta property="og:description" content="Solar panels, inverters, batteries, pumps & complete solar systems. COD & UPI available.">
<meta property="og:url" content="https://www.sunpowers.in/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1e8e3e; --g-d:#14692c; --g-l:#e8f5e9; --g-m:#c8e6c9;
  --bg:#f4f7f3; --card:#fff; --txt:#1c2b20; --mut:#66756a; --line:#e2e9e1;
  --org:#e8590c; --red:#d93025; --gold:#f9a825;
  --r:16px; --sh:0 1px 2px rgba(16,40,20,.06),0 4px 14px rgba(16,40,20,.06);
  --navh:64px; --tickh:0px;
}
@supports (color:color-mix(in srgb,red 50%,blue)){
  :root{ --g-d:color-mix(in srgb,var(--g) 72%,#000); --g-l:color-mix(in srgb,var(--g) 10%,#fff); --g-m:color-mix(in srgb,var(--g) 25%,#fff); }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;padding-bottom:calc(var(--navh) + var(--tickh) + env(safe-area-inset-bottom) + 8px);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
.hide{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 var(--line)}
.hdr-top{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand-logo{font-size:26px;line-height:1;flex:none}
.brand-logo img{width:36px;height:36px;object-fit:contain;border-radius:8px;display:block}
.brand-name{font-size:21px;font-weight:800;color:var(--g-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--g-m);background:var(--g-l);color:var(--g-d);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;position:relative;flex:none;border:1px solid var(--line);background:#fff}
.ibtn:active{transform:scale(.95)}
.ibtn .dot{position:absolute;right:1px;top:1px;width:10px;height:10px;border-radius:50%;background:var(--g);border:2px solid #fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef3ee;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:#556;background:transparent;border:0}
.seg button.on{background:#fff;color:var(--g-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.acc-hd{display:flex;align-items:center;gap:12px}
.acc-av{width:52px;height:52px;border-radius:16px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.ost{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:#eef3ee;color:var(--g-d)}
.ost.new{background:#fff3cd;color:#8a6100}.ost.cancelled{background:#fdecea;color:#c62828}.ost.shipped,.ost.paid{background:#e8eaf6;color:#3949ab}
.orow{border-bottom:1px solid var(--line);padding:10px 0}.orow:last-child{border-bottom:0}
.linkbtn{background:none;border:0;color:var(--g-d);font-weight:700;padding:6px 0;text-decoration:underline}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.search{display:flex;align-items:center;gap:8px;background:#f1f4f0;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px;height:44px}
.search:focus-within{border-color:var(--g);background:#fff;box-shadow:0 0 0 3px var(--g-l)}
.search input{flex:1;border:0;background:none;outline:0;font-size:15px;min-width:0;height:100%}
.search .x{font-size:18px;color:var(--mut);padding:4px}

/* blocks */
main{padding-top:12px}
.blk{margin-bottom:18px}
.bh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 10px}
.bh h2{font-size:18px;font-weight:800;line-height:1.2}
.bh p{font-size:13px;color:var(--mut)}
.va{color:var(--g);font-weight:700;font-size:14px;white-space:nowrap;padding:4px 0}

/* slideshow */
.ss{position:relative;border-radius:20px;overflow:hidden;height:var(--h,190px);background:var(--g-d);box-shadow:var(--sh);touch-action:pan-y;user-select:none}
.ss-track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1)}
.ss.fade .ss-track{display:block;position:relative}
.sl{position:relative;flex:0 0 100%;height:100%;overflow:hidden;cursor:pointer;color:#fff;background:var(--c);background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff))}
.ss.fade .sl{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.ss.fade .sl.on{opacity:1;z-index:1}
.sl img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl.hasimg.hastext::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.sl-in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:16px 46% 26px 20px;gap:4px}
.sl.hasimg .sl-in{padding-right:30%}
.sl-in h3{font-size:clamp(20px,5.4vw,30px);font-weight:800;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.sl-in p{font-size:clamp(13px,3.4vw,16px);opacity:.95}
.sl-btn{align-self:flex-start;margin-top:8px;background:#fff;color:var(--txt);font-weight:700;border-radius:999px;padding:6px 16px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sl-emo{position:absolute;right:6%;top:50%;transform:translateY(-55%);font-size:clamp(70px,22vw,120px);z-index:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.ss-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ss-arr.l{left:8px}.ss-arr.r{right:8px}
@media (hover:none){.ss-arr{display:none}}
@media (hover:hover){.sl-in{padding-left:52px}.sl.hasimg .sl-in{padding-left:52px}}
.ss-dots{position:absolute;left:0;right:0;bottom:30px;z-index:5;display:flex;justify-content:center;gap:6px}
.ss-dots button{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:all .3s}
.ss-dots button.on{width:20px;background:#fff}
.ss.noribbon .ss-dots{bottom:10px}
.ss-rib{position:absolute;left:0;right:0;bottom:0;z-index:4;height:24px;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center}
.ss-rib span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* services */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc-c{background:var(--b,#e8f5e9);border-radius:var(--r);padding:12px;min-height:104px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(0,0,0,.04);cursor:pointer;text-align:left}
.svc-c .i{font-size:26px}
.svc-c b{font-size:15px;font-weight:800}
.svc-c small{font-size:12px;color:var(--mut);line-height:1.3}
.svc-c em{font-style:normal;font-size:13px;font-weight:700;color:var(--org);margin-top:auto}
@media(min-width:760px){.svc{grid-template-columns:repeat(4,1fr)}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1060px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pc{background:var(--card);border-radius:var(--r);padding:8px;position:relative;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
.pc-img{position:relative;display:grid;place-items:center;aspect-ratio:1/.86;border-radius:12px;overflow:hidden;background:var(--b,#e8f5e9)}
.pc-img .emo{font-size:clamp(46px,13vw,64px)}
.pc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-off{position:absolute;left:6px;top:6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;z-index:1}
.pc-bdg{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:var(--g-d);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;z-index:1}
.heart{position:absolute;right:12px;top:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#b0b8b2}
.heart.on{color:var(--red)}
.pc-t{font-weight:700;font-size:14px;line-height:1.25;margin:8px 2px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc-tag{font-size:12px;color:var(--mut);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tag i{font-style:normal;color:var(--g)}
.pc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin:6px 2px 0;margin-top:auto;padding-top:6px}
.pr b{font-size:17px;font-weight:800}
.pr s{font-size:12px;color:var(--mut);display:block;line-height:1}
.add{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-size:22px;font-weight:600;display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.add:active{transform:scale(.92)}
.add[disabled]{background:#c9d1cb;box-shadow:none}
.oos{font-size:11px;color:var(--red);font-weight:700}

/* update band (horizontal) */
.band{background:linear-gradient(180deg,#fff4e0,#fff8ec);border:1px solid #ffe2b3;border-radius:20px;padding:12px}
.band .bh h2{color:#b45309}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 20px)/2.3);gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.hs .pc{scroll-snap-align:start}
@media(min-width:560px){.hs{grid-auto-columns:calc((100% - 30px)/3.3)}}
@media(min-width:820px){.hs{grid-auto-columns:calc((100% - 50px)/5)}}

/* form & howto */
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.fgrid{display:grid;gap:10px}
@media(min-width:640px){.fgrid.two{grid-template-columns:1fr 1fr}}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:#334}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #cfd8cf;border-radius:12px;padding:10px 12px;background:#fff;outline:0;font-size:15px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g-l)}
.err{color:var(--red);font-size:12px;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px)}
.btn.out{background:#fff;color:var(--g-d);border:1.5px solid var(--g)}
.btn.wa{background:#25d366;color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:800;text-align:left}
.acc-h .ar{transition:transform .25s;font-size:20px;color:var(--g)}
.acc.open .acc-h .ar{transform:rotate(180deg)}
.acc-b{display:none;margin-top:12px}
.acc.open .acc-b{display:block}
.steps{counter-reset:s;list-style:none;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.paybox{margin-top:12px;background:var(--g-l);border-radius:14px;padding:12px;display:grid;gap:6px}
.paybox b{color:var(--g-d)}

/* feedback marquee */
.fbm{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.fbt{display:flex;gap:10px;width:max-content;animation:fbs var(--d,40s) linear infinite}
.fbm:hover .fbt{animation-play-state:paused}
@keyframes fbs{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.fbc{width:260px;flex:none;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}
.fbc .st{color:var(--gold);letter-spacing:1px}
.fbc p{font-size:14px;margin:4px 0 6px}
.fbc small{color:var(--mut);font-weight:600}

/* videos */
.vids{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,78%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
@media(min-width:760px){.vids{grid-auto-columns:calc((100% - 20px)/3)}}
.vd{scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.vd-f{position:relative;aspect-ratio:16/9;background:#111;display:grid;place-items:center;cursor:pointer;color:#fff}
.vd-f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vd-f iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:relative;width:56px;height:40px;border-radius:12px;background:#ff0000;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.vd-ph{background:linear-gradient(135deg,#263238,#455a64);font-size:14px;text-align:center;padding:10px}
.vd b{display:block;padding:8px 10px;font-size:14px}

/* pages */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:20px;font-weight:800;line-height:1.2}
.back{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:20px;flex:none}
.pd{display:grid;gap:14px}
@media(min-width:820px){.pd{grid-template-columns:1fr 1fr;align-items:start}}
.gal-m{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center;background:var(--b,#e8f5e9)}
.gal-m img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.gal-m .emo{font-size:120px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#fff}
.thumbs button.on{border-color:var(--g)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:22px;font-weight:800;line-height:1.2}
.pd .tg{color:var(--g-d);font-weight:600;margin-top:2px}
.bigp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:10px 0}
.bigp b{font-size:28px;font-weight:800}
.bigp s{color:var(--mut)}
.bigp em{font-style:normal;color:#fff;background:var(--red);border-radius:6px;padding:0 6px;font-weight:700;font-size:13px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.qty button{width:38px;height:38px;font-size:20px;font-weight:700;color:var(--g-d)}
.qty span{min-width:34px;text-align:center;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.desc{white-space:pre-wrap;font-size:15px}
.kv{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.kv td{padding:7px 4px;border-bottom:1px solid var(--line)}
.kv td:first-child{color:var(--mut);width:40%}
.sortbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.sortbar select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.cat .i{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--g-l);display:grid;place-items:center;flex:none}
.cat b{display:block;font-size:15px;line-height:1.2}
.cat small{color:var(--mut)}
.ci{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;box-shadow:var(--sh);margin-bottom:8px}
.ci-img{width:64px;height:64px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:32px;overflow:hidden;position:relative;background:var(--b,#e8f5e9)}
.ci-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci-m{flex:1;min-width:0}
.ci-m b{display:block;font-size:14px;line-height:1.25}
.rm{color:var(--red);font-size:13px;font-weight:600;padding:4px 0}
.tot{display:grid;gap:6px;font-size:15px}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-size:18px;font-weight:800;border-top:1px dashed var(--line);padding-top:8px}
.popt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.popt.on{border-color:var(--g);background:var(--g-l)}
.popt input{margin-top:4px;accent-color:var(--g);width:18px;height:18px}
.popt small{display:block;color:var(--mut)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty .i{font-size:56px;margin-bottom:6px}
.ok{text-align:center}
.ok .i{font-size:64px}
.upi{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--g-l);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:12px;padding:10px 12px;font-size:14px}

/* footer, nav, ticker, toast */
footer{margin-top:20px;padding:18px 0 10px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
footer .fl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
footer .fl a{color:var(--g-d);font-weight:600}
footer .legal{margin-top:8px;line-height:1.5}
.doc{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);max-width:820px}
.doc h2{font-size:18px;font-weight:800;margin:16px 0 6px;color:var(--g-d)}
.doc h2:first-child{margin-top:0}
.doc p{margin:6px 0}
.doc ul{margin:6px 0 6px 20px;display:grid;gap:4px}
.doc a{color:var(--g-d);text-decoration:underline;word-break:break-word}
.revsum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px}
.revsum .big{font-size:26px;font-weight:800;line-height:1}
.revsum .st{color:var(--gold);font-size:18px;letter-spacing:1px}
.revsum .grow{flex:1;min-width:120px;color:var(--mut);font-size:13px}
.gbadge{display:inline-block;font-size:11px;font-weight:700;color:#1a73e8;background:#e8f0fe;border-radius:6px;padding:0 6px;margin-left:4px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px;cursor:pointer}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--g);flex:none}
.consent a{color:var(--g-d);text-decoration:underline}
.pnote{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5}
.pnote a{color:var(--g-d);text-decoration:underline}
footer b{color:var(--txt);font-size:16px}
footer .soc{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
footer .soc a{color:var(--g-d);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);padding:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);position:relative}
.nav a .i{font-size:21px;line-height:1;position:relative}
.nav a.on{color:var(--g-d)}
.nav a.on .i::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:3px;border-radius:2px;background:var(--g);transform:translateX(-50%)}
.nav .badge{top:-6px;right:-12px}
.tick{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:59;background:var(--g-l);border-top:1px solid var(--g-m);height:30px;display:flex;align-items:center;font-size:13px}
.tick .wrap{display:flex;align-items:center;gap:8px;width:100%}
.tick .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.tick .tx b{color:var(--g-d)}
.tick button{font-size:16px;color:var(--mut);padding:0 4px}
.fab{position:fixed;right:12px;bottom:calc(var(--navh) + var(--tickh) + env(safe-area-inset-bottom) + 12px);z-index:58;width:46px;height:46px;opacity:.95;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(90deg,#e9eee8 25%,#f5f8f4 50%,#e9eee8 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.offline{background:#fff3cd;color:#7a5b00;font-size:12px;text-align:center;padding:4px}
@media (prefers-reduced-motion:reduce){.ss-rib span,.fbt{animation:none}.ss-track,.ss.fade .sl{transition:none}}

/* ---------------- slideshow engine ---------------- */
function mountSlideshows() {
  $$('.ss').forEach(function (el) {
    var ss = S.slideshows.filter(function (x) { return x.id === el.getAttribute('data-ss'); })[0]; if (!ss) return;
    var slides = $$('.sl', el), dots = $$('.ss-dots button', el), track = $('.ss-track', el), rib = $('.ss-rib', el), ribSpan = $('.ss-rib span', el);
    var vis = ss.slides.filter(function (s) { return s.visible !== false; });
    var n = slides.length, i = 0, fade = ss.effect === 'fade', paused = false;
    function show(k) {
      i = (k + n) % n;
      if (fade) slides.forEach(function (s, j) { s.classList.toggle('on', j === i); });
      else track.style.transform = 'translateX(' + (-100 * i) + '%)';
      dots.forEach(function (d, j) { d.classList.toggle('on', j === i); });
      var r = vis[i] && vis[i].ribbon;
      el.classList.toggle('noribbon', !r); rib.classList.toggle('hide', !r);
      if (r && ribSpan.textContent !== r) { ribSpan.textContent = r; ribSpan.style.animation = 'none'; void ribSpan.offsetWidth; ribSpan.style.animation = ''; }
    }
    show(0);
    if (n > 1 && ss.autoplay !== false) {
      var tm = setInterval(function () { if (!paused && !document.hidden) show(i + 1); }, Math.max(1, SP.num(ss.interval) || 4) * 1000);
      timers.push(tm);
    }
    el.addEventListener('mouseenter', function () { paused = true; });
    el.addEventListener('mouseleave', function () { paused = false; });
    var a = $('.ss-arr.l', el), b = $('.ss-arr.r', el);
    if (a) a.addEventListener('click', function (e) { e.stopPropagation(); show(i - 1); });
    if (b) b.addEventListener('click', function (e) { e.stopPropagation(); show(i + 1); });
    dots.forEach(function (d, j) { d.addEventListener('click', function (e) { e.stopPropagation(); show(j); }); });
    var x0 = null, y0 = null, moved = false;
    el.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; paused = true; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      paused = false; if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { moved = true; show(dx < 0 ? i + 1 : i - 1); }
      x0 = null;
    }, { passive: true });
    el.addEventListener('click', function (e) {
      if (moved) { moved = false; return; }
      if (e.target.closest('.ss-arr,.ss-dots')) return;
      var s = slides[i]; if (s) doLink(s.getAttribute('data-lt'), s.getAttribute('data-l'), s.getAttribute('data-subj'));
    });
  });
}

  clearTimers();
  var q = new URLSearchParams(location.search), v = curView();
  $$('.nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-tab') === (v === 'home' && searchQ ? '' : v)); });
  try {
    if (v === 'product') renderProduct(q.get('p'));
    else if (v === 'section') renderSection(q.get('s'));
    else if (v === 'cart') renderCart();
    else if (v === 'wishlist') renderWishlist();
    else if (v === 'categories') renderCategories();
    else if (v === 'help') renderHelp();
    else if (v === 'account' || (window.SPAuth && SPAuth.resetToken())) renderAccount();
    else if (v === 'page') renderPage(q.get('page'));
    else if (searchQ) renderSearch();
    else renderHome();
  } catch (e) {
    console.error(e);
    view.innerHTML = '<div class="empty"><div class="i">⚠️</div>Error: ' + esc(e.message) + '<br><br><a class="btn" href="./">' + t('home') + '</a></div>';
  }
}
function clearSearch() { searchQ = ''; $('#q').value = ''; $('#qx').classList.add('hide'); }

/* ---------------- global events ---------------- */
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[data-nav]');
  if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault(); var href = a.getAttribute('href');
    if (href === './' || href === '?' || href === '') { clearSearch(); go(location.pathname); } else go(href);
    return;
  }
  var el;
  if ((el = e.target.closest('[data-add]'))) { e.preventDefault(); addToCart(el.getAttribute('data-add'), 1); return; }
  if ((el = e.target.closest('[data-wish]'))) { e.preventDefault(); toggleWish(el.getAttribute('data-wish')); return; }
  if ((el = e.target.closest('[data-back]'))) { if (history.state && history.state.d > 0) history.back(); else { clearSearch(); go(location.pathname); } return; }
  if ((el = e.target.closest('[data-acc]'))) { var acc = el.closest('.acc'); acc.classList.toggle('open'); el.setAttribute('aria-expanded', acc.classList.contains('open')); return; }
  if ((el = e.target.closest('[data-chip]'))) {
    $$('.chip').forEach(function (c) { c.classList.toggle('on', c === el); });
    var id = el.getAttribute('data-chip');
    if (!id) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var target = document.getElementById('blk-' + id);
    if (target) {
      var y = target.getBoundingClientRect().top + window.scrollY - $('.hdr').offsetHeight - 8; window.scrollTo({ top: y, behavior: 'smooth' });
    } else go('?s=' + encodeURIComponent(id));
    return;
  }
  if ((el = e.target.closest('[data-yt]'))) {
    var yid = el.getAttribute('data-yt');
    el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + yid + '?autoplay=1&rel=0" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    el.removeAttribute('data-yt'); return;
  }
  if ((el = e.target.closest('.svc-c[data-lt]'))) { doLink(el.getAttribute('data-lt'), el.getAttribute('data-l'), el.getAttribute('data-subj')); return; }
});
window.addEventListener('popstate', function (e) {
  route();
  var y = e.state && e.state.y; if (y) requestAnimationFrame(function () { setTimeout(function () { window.scrollTo(0, y); }, 30); });
});
var onSearch = SP.debounce(function () {
  var v = $('#q').value.trim();
  if (v === searchQ) return;
  searchQ = v; $('#qx').classList.toggle('hide', !v);
  if (v && curView() !== 'home') { history.pushState({ y: 0, d: ((history.state && history.state.d) || 0) + 1 }, '', location.pathname); }
  route(); if (v) track('search', { search_string: v });
}, 250);
$('#q').addEventListener('input', onSearch);
$('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); onSearch(); this.blur(); } });
$('#qx').addEventListener('click', function () { clearSearch(); route(); $('#q').focus(); });
$('#langBtn').addEventListener('click', function () { lang = lang === 'en' ? 'hi' : 'en'; SP.ls.set('sp_lang', lang); applyChrome(); route(); toast(lang === 'en' ? 'English' : 'हिंदी'); });
$('#tickX').addEventListener('click', function () { SP.ss.set('sp_tick_off', '1'); setupTicker(); });

/* ---------------- boot ---------------- */
function start(res) {
  S = res.data; SOURCE = res.source;
  if (lang !== 'hi' && lang !== 'en') lang = S.settings.defaultLang === 'en' ? 'en' : 'hi';
  applyChrome(); badges(); route(); initIntegrations(); accDot();
  if (ctok() && !start._acc) { start._acc = 1; accRefresh().catch(function () {}); }
  var off = $('#offline'); off.classList.toggle('hide', SOURCE !== 'cache'); off.textContent = t('offline');
}
var cached = SP.ls.get(SP.CACHE_KEY, null), started = false;
if (cached && Array.isArray(cached.layout)) { try { start({ data: SP.normalize(cached), source: 'cache-fast' }); started = true; } catch (e) { console.error(e); } }
SP.loadStore().then(function (res) {
  if (res.error) console.warn('Store load:', res.error.message);
  if (started && res.source === 'cache') { var ob = $('#offline'); ob.textContent = t('offline'); ob.classList.remove('hide'); }
  if (!started || res.source === 'db' || res.source === 'demo') {
    if (started && res.source === 'db' && JSON.stringify(res.data) === JSON.stringify(S)) return;
    var y = window.scrollY; start(res); if (started) window.scrollTo(0, y);
  }
  started = true;
});
})();
</script>
</body>
